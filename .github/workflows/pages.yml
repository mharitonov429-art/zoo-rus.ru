name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # раз в сутки: сдвиг блока ротации ссылок на главной
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сборка (по расписанию со сдвигом ротации)
        run: node build.mjs ${{ github.event_name == 'schedule' && '--rotate' || '' }}
      - name: Проверка сайта
        run: node scripts/check.mjs
      - name: Сохранить состояние ротации
        run: |
          git config user.name "zoo-meshyagutovo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/rotation-state.json
          git diff --cached --quiet || (git commit -m "rotation state" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
